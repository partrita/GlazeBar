name: Package release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Target release tag (leave blank to use current git tag/ref)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            msvc_arch: amd64_arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native-rust/target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('native-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      - name: Update resource version to match target release
        shell: pwsh
        run: |
          $rawTag = '${{ inputs.tag != '' && inputs.tag || github.ref_name }}'
          $version = if ($rawTag.StartsWith('v')) { $rawTag.Substring(1) } else { $rawTag }
          Write-Host "Updating native-rust/glazebar.rc version to: $version"
          
          # Convert version like '0.0.1' or '0.1.0-preview.7' to comma-separated numbers for FILEVERSION/PRODUCTVERSION
          $coreVer = $version.Split('-')[0]
          $parts = $coreVer.Split('.')
          while ($parts.Length -lt 4) { $parts += '0' }
          $commas = $parts[0..3] -join ','

          $rcPath = "native-rust/glazebar.rc"
          $rcContent = Get-Content $rcPath -Raw
          $rcContent = $rcContent -replace 'FILEVERSION\s+[\d,]+', "FILEVERSION $commas"
          $rcContent = $rcContent -replace 'PRODUCTVERSION\s+[\d,]+', "PRODUCTVERSION $commas"
          $rcContent = $rcContent -replace 'VALUE "FileVersion",\s*"[^"]*"', "VALUE `"FileVersion`", `"$version\0`""
          $rcContent = $rcContent -replace 'VALUE "ProductVersion",\s*"[^"]*"', "VALUE `"ProductVersion`", `"$version\0`""
          Set-Content -Path $rcPath -Value $rcContent -Encoding ascii
          Get-Content $rcPath

      - name: Build Binary
        working-directory: native-rust
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare Architecture Binary Artifacts
        shell: pwsh
        run: |
          $binDir = "native-rust/target/${{ matrix.target }}/release"
          $outDir = "dist-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          
          Copy-Item "$binDir/glazebar-native.exe" "$outDir/GlazeBar.exe"
          Copy-Item "$binDir/glazebar-native.exe" "$outDir/GlazeTheme.exe"
          
          Compress-Archive -Path "$outDir/*" -DestinationPath "GlazeBar-windows-${{ matrix.arch }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlazeBar-windows-${{ matrix.arch }}
          path: GlazeBar-windows-${{ matrix.arch }}.zip

  package-and-release:
    name: Package and Release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded-artifacts

      - name: Set up Inno Setup
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --version=6.7.3 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $compiler)) {
              throw 'Inno Setup installation failed'
            }
          }
          Write-Host "Inno Setup compiler verified at: $compiler"

      - name: Verify release tag and ensure release exists
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Target release tag: $env:RELEASE_TAG"
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$') {
            throw "Invalid release tag format: $env:RELEASE_TAG (expected semver like v0.0.1 or v0.1.0-preview.7)"
          }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,tagName 2>$null | ConvertFrom-Json
          if (!$release) {
            Write-Host "Release $env:RELEASE_TAG does not exist yet. Creating release..."
            $isPrerelease = $env:RELEASE_TAG -match '-'
            if ($isPrerelease) {
              gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TAG --generate-notes --prerelease
            } else {
              gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TAG --generate-notes
            }
          }

      - name: Prepare Release Bundles and Compile Installers
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:RELEASE_TAG.StartsWith('v')) { $env:RELEASE_TAG.Substring(1) } else { $env:RELEASE_TAG }
          $compiler = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (!$compiler -or !(Test-Path $compiler)) {
            $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          }

          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Get-ChildItem -Path downloaded-artifacts -Filter "*.zip" -Recurse | Copy-Item -Destination release-output/ -Force

          # 1. Check if Community bundle ZIPs are already uploaded to current release
          $bundleRoot = "distribution/output-release"
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null
          $hasBundles = $false

          try {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'GlazeBar-Community-*-windows-*.zip' --pattern SHA256SUMS.txt --dir downloaded-bundles
            if ($LASTEXITCODE -eq 0 -and (Test-Path downloaded-bundles)) {
              foreach ($arch in 'x64', 'arm64') {
                $zipFile = Get-ChildItem -Path downloaded-bundles -Filter "*windows-$arch.zip" | Select-Object -First 1
                if ($zipFile) {
                  $targetDir = "$bundleRoot/GlazeBar-Community-$version-windows-$arch"
                  Expand-Archive -Path $zipFile.FullName -DestinationPath $targetDir -Force
                  if (Test-Path "$targetDir/manifest.json") {
                    $hasBundles = $true
                  }
                }
              }
            }
          } catch {
            Write-Host "No pre-existing bundles found in current release tag: $_"
          }

          # 2. If not found in current release, fetch upstream base bundle to repackage with newly built GlazeBar
          if (!$hasBundles) {
            Write-Host "Attempting to repackage base bundle from upstream release (v0.1.0-preview.7)..."
            New-Item -ItemType Directory -Force -Path upstream-base | Out-Null
            try {
              gh release download v0.1.0-preview.7 --repo lamininA1/GlazeBar --pattern 'GlazeBar-Community-*-windows-*.zip' --dir upstream-base
              if ($LASTEXITCODE -eq 0 -and (Test-Path upstream-base)) {
                # Extract GlazeBar.exe from downloaded build artifacts
                $artifactZips = Get-ChildItem -Path downloaded-artifacts -Filter "*.zip" -Recurse
                foreach ($az in $artifactZips) {
                  Write-Host "Extracting build artifact: $($az.FullName)"
                  Expand-Archive -Path $az.FullName -DestinationPath $az.DirectoryName -Force
                }

                $repackageSuccess = $true
                foreach ($arch in 'x64', 'arm64') {
                  $baseZip = Get-ChildItem -Path upstream-base -Filter "*windows-$arch.zip" | Select-Object -First 1
                  $barExe = Get-ChildItem -Path downloaded-artifacts -Filter "GlazeBar.exe" -Recurse | Where-Object {
                    if ($arch -eq 'x64') { $_.FullName -like "*windows-x64*" } else { $_.FullName -like "*windows-arm64*" }
                  } | Select-Object -First 1

                  if ($baseZip -and $barExe) {
                    Write-Host "Repackaging $arch bundle using $($baseZip.Name) and $($barExe.FullName) (Slim)..."
                    python distribution/Repackage-Bundle.py --base $baseZip.FullName --bar $barExe.FullName --output $bundleRoot --version $version --slim
                    $expectedDir = "$bundleRoot/GlazeBar-Community-$version-windows-$arch"
                    if (!(Test-Path "$expectedDir/manifest.json")) {
                      Write-Warning "Repackaged bundle missing manifest: $expectedDir"
                      $repackageSuccess = $false
                    }
                  } else {
                    Write-Warning "Missing baseZip or barExe for $arch (baseZip: $($baseZip?.Name), barExe: $($barExe?.FullName))"
                    $repackageSuccess = $false
                  }
                }
                $hasBundles = $repackageSuccess
              }
            } catch {
              Write-Warning "Repackage base bundle failed: $_"
              $hasBundles = $false
            }
          }

          # Verify both bundle folders exist and contain manifest.json before proceeding to installer build
          $bundlesVerified = $true
          foreach ($arch in 'x64', 'arm64') {
            $checkDir = "$bundleRoot/GlazeBar-Community-$version-windows-$arch"
            if (!(Test-Path "$checkDir/manifest.json")) {
              $bundlesVerified = $false
            }
          }
          $hasBundles = $bundlesVerified

          # 3. If bundles are available, validate and compile Inno Setup installers
          if ($hasBundles) {
            Write-Host "Validating isolated bundles..."
            foreach ($arch in 'x64', 'arm64') {
              $archBundle = "$bundleRoot/GlazeBar-Community-$version-windows-$arch"
              ./distribution/Test-Bundle.ps1 -Bundle $archBundle
              # Also compress the community bundle into zip for release
              Compress-Archive -Path "$archBundle/*" -DestinationPath "release-output/GlazeBar-Community-$version-windows-$arch.zip" -Force
            }

            Write-Host "Compiling installers using Build-Setup.ps1..."
            ./distribution/Build-Setup.ps1 -BundleRoot $bundleRoot -Version $version -Architectures x64,arm64 -Compiler $compiler
            
            $x64Installer = "distribution/setup-output/GlazeBar-GlazeWM-Setup-$version-x64.exe"
            if (Test-Path $x64Installer) {
              ./distribution/Test-SetupStartup.ps1 -SetupExe $x64Installer
            }
            Get-ChildItem -Path distribution/setup-output -Filter "*.exe" | Copy-Item -Destination release-output/ -Force
          } else {
            Write-Host "Community bundles not assembled. Packaging standalone binaries only."
          }

          # 4. Generate SHA256 checksums for all release files
          Get-ChildItem -Path release-output -File | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -LiteralPath "release-output/SHA256SUMS.txt" -Encoding ascii

          # 5. Upload everything to GitHub Release
          Write-Host "Uploading release assets to $env:RELEASE_TAG..."
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY (Get-ChildItem -Path release-output -File | ForEach-Object { $_.FullName }) --clobber
