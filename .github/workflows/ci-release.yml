name: CI & Release

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native-rust/target/
          key: ${{ runner.os }}-cargo-test-${{ matrix.target }}-${{ hashFiles('native-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.target }}-

      - name: Run Tests
        working-directory: native-rust
        run: |
          cargo test --locked --target ${{ matrix.target }}

  build:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            msvc_arch: amd64_arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native-rust/target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('native-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      - name: Build Binary
        working-directory: native-rust
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          $binDir = "native-rust/target/${{ matrix.target }}/release"
          $outDir = "dist-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          
          # Copy main binary and create alias if needed
          Copy-Item "$binDir/glazebar-native.exe" "$outDir/GlazeBar.exe"
          Copy-Item "$binDir/glazebar-native.exe" "$outDir/GlazeTheme.exe"
          
          # Archive binary folder
          Compress-Archive -Path "$outDir/*" -DestinationPath "GlazeBar-windows-${{ matrix.arch }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlazeBar-windows-${{ matrix.arch }}
          path: GlazeBar-windows-${{ matrix.arch }}.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Get-ChildItem -Path release-artifacts -Filter "*.zip" -Recurse | Copy-Item -Destination release-files/ -Force
          Get-ChildItem -Path release-files

      - name: Set up Inno Setup
        uses: emilytrau/Setup-InnoSetup@v1

      - name: Build Installers
        id: build_installers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (!$compiler -or !(Test-Path $compiler)) {
            $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          }

          $rawTag = '${{ github.ref_name }}'
          $version = if ($rawTag.StartsWith('v')) { $rawTag.Substring(1) } else { $rawTag }
          $bundleRoot = "distribution/output-release"
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          # Download existing bundle ZIPs from release/upstream if available
          $hasBundles = $false
          try {
            Write-Host "Checking for existing bundles for tag $rawTag..."
            gh release download $rawTag --repo $env:GITHUB_REPOSITORY --pattern 'GlazeBar-Community-*-windows-*.zip' --pattern SHA256SUMS.txt --dir downloaded-bundles
            if ($LASTEXITCODE -eq 0 -and (Test-Path downloaded-bundles)) {
              foreach ($arch in 'x64', 'arm64') {
                $zipFile = Get-ChildItem -Path downloaded-bundles -Filter "*windows-$arch.zip" | Select-Object -First 1
                if ($zipFile) {
                  Expand-Archive -Path $zipFile.FullName -DestinationPath "$bundleRoot/GlazeBar-Community-$version-windows-$arch" -Force
                  $hasBundles = $true
                }
              }
            }
          } catch {
            Write-Warning "Could not fetch pre-existing bundles: $_"
          }

          if ($hasBundles) {
            Write-Host "Compiling installers using Build-Setup.ps1..."
            ./distribution/Build-Setup.ps1 -BundleRoot $bundleRoot -Version $version -Architectures x64,arm64 -Compiler $compiler
            
            if (Test-Path "distribution/setup-output/GlazeBar-GlazeWM-Setup-$version-x64.exe") {
              try {
                ./distribution/Test-SetupStartup.ps1 -SetupExe "distribution/setup-output/GlazeBar-GlazeWM-Setup-$version-x64.exe"
              } catch {
                Write-Warning "Startup test warning: $_"
              }
            }
            Get-ChildItem -Path distribution/setup-output | Copy-Item -Destination release-files/ -Force
          } else {
            Write-Host "Standard community bundle layout not found. Skipping installer generation for standalone binaries."
          }

      - name: Generate Checksums
        run: |
          Get-ChildItem -Path release-files -File | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -LiteralPath "release-files/SHA256SUMS.txt" -Encoding ascii
          Get-Content release-files/SHA256SUMS.txt

      - name: Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
